services:
  - type: web
    name: jarvis-gold
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@10 install --frozen-lockfile && npx -y pnpm@10 build
    startCommand: node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
